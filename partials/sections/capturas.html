<!-- ================= Capturas ================= -->
<section class="sec" id="capturas" aria-labelledby="t-shots">
  <div class="wrap">
    <div class="showcase">
      <div class="show-side">
        <div class="show-head">
          <h2 id="t-shots">Así se ve Vexa</h2>
          <p class="sub">
            Las pantallas de la app, tal como se ven en tu Android. Elige una
            para verla en grande.
          </p>
        </div>
        <div class="show-list" id="showList" role="tablist" aria-label="Pantallas de la app" aria-orientation="vertical">
          <button class="show-tab" role="tab" id="tab-inicio" type="button" aria-selected="true" aria-controls="showPanel" tabindex="0" data-desc="Resumen del día: vencidos, vencen hoy y productos críticos.">
            <b>Inicio</b><span>Resumen del día: vencidos, vencen hoy y productos críticos.</span>
          </button>
          <button class="show-tab" role="tab" id="tab-productos" type="button" aria-selected="false" aria-controls="showPanel" tabindex="-1" data-desc="Lista agrupada por días de vencimiento.">
            <b>Productos</b><span>Lista agrupada por días de vencimiento.</span>
          </button>
          <button class="show-tab" role="tab" id="tab-escaner" type="button" aria-selected="false" aria-controls="showPanel" tabindex="-1" data-desc="Normal, continuo o por lote, o ingresa el código a mano.">
            <b>Escáner</b><span>Normal, continuo o por lote, o ingresa el código a mano.</span>
          </button>
          <button class="show-tab" role="tab" id="tab-detalle" type="button" aria-selected="false" aria-controls="showPanel" tabindex="-1" data-desc="Estado, cantidad e información de cada producto.">
            <b>Detalle</b><span>Estado, cantidad e información de cada producto.</span>
          </button>
          <button class="show-tab" role="tab" id="tab-editar" type="button" aria-selected="false" aria-controls="showPanel" tabindex="-1" data-desc="Código, nombre, categoría sugerida, foto y sucursal.">
            <b>Editar producto</b><span>Código, nombre, categoría sugerida, foto y sucursal.</span>
          </button>
          <button class="show-tab" role="tab" id="tab-alertas" type="button" aria-selected="false" aria-controls="showPanel" tabindex="-1" data-desc="Historial de avisos con lo pendiente por leer.">
            <b>Alertas</b><span>Historial de avisos con lo pendiente por leer.</span>
          </button>
          <button class="show-tab" role="tab" id="tab-reportes" type="button" aria-selected="false" aria-controls="showPanel" tabindex="-1" data-desc="Aprovechamiento por semana o mes y categorías con más pérdidas.">
            <b>Reportes</b><span>Aprovechamiento por semana o mes y categorías con más pérdidas.</span>
          </button>
          <button class="show-tab" role="tab" id="tab-mas" type="button" aria-selected="false" aria-controls="showPanel" tabindex="-1" data-desc="Reportes, respaldo, configuración y datos de la app.">
            <b>Más</b><span>Reportes, respaldo, configuración y datos de la app.</span>
          </button>
          <button class="show-tab" role="tab" id="tab-configuracion" type="button" aria-selected="false" aria-controls="showPanel" tabindex="-1" data-desc="Tema, modo de la app, días de aviso y categorías.">
            <b>Configuración</b><span>Tema, modo de la app, días de aviso y categorías.</span>
          </button>
          <button class="show-tab" role="tab" id="tab-respaldo" type="button" aria-selected="false" aria-controls="showPanel" tabindex="-1" data-desc="Exporta e importa tus productos en JSON o CSV.">
            <b>Datos y respaldo</b><span>Exporta e importa tus productos en JSON o CSV.</span>
          </button>
          <button class="show-tab" role="tab" id="tab-acerca" type="button" aria-selected="false" aria-controls="showPanel" tabindex="-1" data-desc="Versión y lo que puedes hacer; los datos se quedan en tu teléfono.">
            <b>Acerca de</b><span>Versión y lo que puedes hacer; los datos se quedan en tu teléfono.</span>
          </button>
        </div>
        <p class="show-desc" id="showDesc" aria-live="polite">Resumen del día: vencidos, vencen hoy y productos críticos.</p>
      </div>

      <div class="show-stage">
        <div class="shot-phone">
          <div class="show-imgs" id="showPanel" role="tabpanel" aria-labelledby="tab-inicio">
            <img class="show-img is-on" src="img/capturas/inicio.webp" width="600" height="1200" decoding="async" alt="Pantalla de inicio con el resumen de productos vencidos, que vencen hoy y próximos, y la lista de productos críticos" />
            <img class="show-img" src="img/capturas/productos.webp" width="600" height="1200" loading="lazy" decoding="async" alt="Lista de productos agrupada por días desde que vencieron, con categoría y sucursal" aria-hidden="true" />
            <img class="show-img" src="img/capturas/escaner.webp" width="600" height="1200" loading="lazy" decoding="async" alt="Escáner con la cámara lista para leer un código de barras y los modos Normal, Continuo y Lote" aria-hidden="true" />
            <img class="show-img" src="img/capturas/detalle.webp" width="600" height="1200" loading="lazy" decoding="async" alt="Detalle de un producto vencido con su cantidad e información del código de barras" aria-hidden="true" />
            <img class="show-img" src="img/capturas/editar.webp" width="600" height="1200" loading="lazy" decoding="async" alt="Formulario para editar un producto con código de barras, nombre y categoría sugerida" aria-hidden="true" />
            <img class="show-img" src="img/capturas/alertas.webp" width="600" height="1200" loading="lazy" decoding="async" alt="Centro de notificaciones con resúmenes diarios y avisos de productos vencidos" aria-hidden="true" />
            <img class="show-img" src="img/capturas/reportes.webp" width="600" height="1200" loading="lazy" decoding="async" alt="Reporte semanal con el porcentaje de aprovechamiento, unidades salvadas y perdidas, y categorías con más pérdidas" aria-hidden="true" />
            <img class="show-img" src="img/capturas/mas.webp" width="600" height="1200" loading="lazy" decoding="async" alt="Menú Más con accesos a reportes, datos y respaldo, configuración y acerca de la aplicación" aria-hidden="true" />
            <img class="show-img" src="img/capturas/configuracion.webp" width="600" height="1200" loading="lazy" decoding="async" alt="Configuración con apariencia, modo de la app, días para próximo a vencer y categorías automáticas" aria-hidden="true" />
            <img class="show-img" src="img/capturas/respaldo.webp" width="600" height="1200" loading="lazy" decoding="async" alt="Pantalla de datos y respaldo con opciones para exportar, importar y sacar una planilla CSV" aria-hidden="true" />
            <img class="show-img" src="img/capturas/acerca.webp" width="600" height="1200" loading="lazy" decoding="async" alt="Acerca de la aplicación con la versión y una lista de lo que se puede hacer con Vexa" aria-hidden="true" />
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
